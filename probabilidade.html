<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Probabilidade Acumulada</title>
    <!-- Materialize CSS para manter o padrão visual -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <link rel="stylesheet" href="prob.css">
</head>
<body class="p-3">
      <ul class="nav nav-tabs">
        <li class="nav-item">
          <a href="index.html" class="nav-link ">Home</a>
        </li>
        <li class="nav-item">
          <a href="preco_compostos.html" class="nav-link  ">Preço composto</a>
        </li>
        <li class="nav-item">
          <a href="inverte_percentual.html" class="nav-link ">Inverte Percentual</a>
        </li>
      </ul>

<div class="container">
    <div class="row">
        <div class="col s12 m8 offset-m2">
            <div class="card z-depth-2">
                <h4 class="center-align" style="color: #312e81;">
                    <i class="material-icons" style="font-size: 35px; vertical-align: bottom;">casino</i> 
                    Probabilidade Cumulativa
                </h4>
                <p class="center-align grey-text">Descubra a chance de um evento ocorrer pelo menos uma vez após várias tentativas.</p>
                
                <div class="divider" style="margin-bottom: 30px;"></div>

                <div class="row">
                    <!-- Entrada: Chance -->
                    <div class="input-field col s12 m6">
                        <i class="material-icons prefix">percent</i>
                        <input id="chanceIndividual" type="number" step="0.01" class="validate" oninput="calcularProbabilidade()">
                        <label for="chanceIndividual">Chance por tentativa (%)</label>
                    </div>

                    <!-- Entrada: Vezes -->
                    <div class="input-field col s12 m6">
                        <i class="material-icons prefix">repeat</i>
                        <input id="numTentativas" type="number" step="1" class="validate" oninput="calcularProbabilidade()">
                        <label for="numTentativas">Número de rodadas (n)</label>
                    </div>
                </div>

                <!-- Saída -->
                <div id="resultadoArea" class="result-box center-align">
                    <span class="grey-text text-darken-1">A chance final de ocorrer pelo menos uma vez é:</span>
                    <span id="displayResultado" class="highlight-prob">0%</span>
                    <p id="explicacaoLogica" class="small grey-text" style="margin-top: 10px; font-style: italic;"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="prob.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
