<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inversor de porcentagem</title>
    <link rel="stylesheet" href="estilo_perc.css">
</head>
<body>
    <nav class="navbar-buttons">
        <a href="index.html" class="btn-nav">Home</a>
        <a href="preco_compostos.html" class="btn-nav">Preço Composto</a>
        <a href="probabilidade.html" class="btn-nav">Probabilidade</a>
    </nav>

    <main class="container">
        <div class="card">
            <h2>Inversor de Porcentagem</h2>
            <p>Descubra quanto é necessário para retornar ao valor original.</p>

            <div class="input-group">
                <label for="inversorTipo">Tipo de Alteração Inicial</label>
                <select id="inversorTipo" onchange="calcularInversao()">
                    <option value="desconto">Eu dei um Desconto</option>
                    <option value="aumento">Eu dei um Aumento</option>
                </select>
            </div>

            <div class="input-group">
                <label>Percentual Aplicado (%)</label>
                <input type="number" id="percentualInput" placeholder="Ex: 50" oninput="calcularInversao()">
            </div>

            <div id="resultado-inversao" class="result-area">
                <span id="textoInversao"></span>
            </div>
        </div>
    </main>
    <script src="invertScript.js"></script>
</body>
</html>
